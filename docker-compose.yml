version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: testflow-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - FRONTEND_URL=http://localhost:5173
      - PROJECT_ROOT=/workspace
    volumes:
      - ./artifacts:/workspace/artifacts
      - ./auth:/workspace/auth
      - ./tests:/workspace/tests
    command: uvicorn app.main:app --host 0.0.0.0 --port 3000 --reload

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: testflow-worker
    working_dir: /opt/testflow-worker
    environment:
      - API_BASE_URL=http://backend:3000
      - POLL_INTERVAL_MS=1000
      - PLAYWRIGHT_IMAGE=mcr.microsoft.com/playwright:v1.55.0-jammy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace
      - ./worker:/opt/testflow-worker
    depends_on:
      - backend
    command: node src/worker.js
